<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d2a33">
<title>划船渡河</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="conn" class="conn hidden">連線中…</div>
<div id="toast" class="toast"></div>

<!-- 首頁 -->
<section id="home" class="screen active">
  <div class="wrap">
    <p class="kicker">冥想小遊戲 06</p>
    <h1>划船渡河</h1>
    <p class="lead">一艘小船，一條河。<br>用呼吸與默契，和夥伴一起划向彼岸。</p>

    <label class="field"><span>你的名字</span><input id="name" maxlength="8" placeholder="例如：小安" autocomplete="off"></label>

    <div class="card">
      <h2>建立船隊</h2>
      <div class="seg" id="newSize">
        <button data-n="2" class="on">2 人</button><button data-n="4">4 人</button><button data-n="6">6 人</button>
      </div>
      <button id="btnCreate" class="primary">建立船隊</button>
    </div>

    <div class="card">
      <h2>加入船隊</h2>
      <input id="code" inputmode="numeric" maxlength="4" placeholder="輸入 4 位數代碼" autocomplete="off">
      <button id="btnJoin" class="primary ghost">上船</button>
    </div>
    <p class="tip">建議戴上耳機，找一個安靜的地方，手機握穩即可。</p>
  </div>
</section>

<!-- 大廳 -->
<section id="lobby" class="screen">
  <div class="wrap">
    <p class="kicker">船隊代碼</p>
    <div class="code" id="lcode">----</div>
    <button id="btnShare" class="link">複製邀請連結</button>
    <div id="boatView" class="boatview"></div>
    <p id="lstatus" class="lead small"></p>
    <div id="hostBox" class="hidden">
      <div class="seg" id="lobbySize">
        <button data-n="2">2 人</button><button data-n="4">4 人</button><button data-n="6">6 人</button>
      </div>
      <div class="row">
        <button id="btnBots" class="ghost">加入示範夥伴</button>
        <button id="btnStart" class="primary">出發</button>
      </div>
    </div>
    <button id="btnLeave" class="link">離開</button>
  </div>
</section>

<!-- 遊戲 -->
<section id="game" class="screen">
  <div id="stage"><canvas id="cv"></canvas></div>
  <div class="hud">
    <div class="bar"><i id="prog"></i></div>
    <div class="hudrow"><span id="hudP">0%</span><span id="hudH">同心 100%</span><button id="btnMute" class="mini" aria-label="音效">♪</button></div>
  </div>
  <div id="intro" class="intro"><div id="introT"></div><div id="introC"></div></div>
  <div id="note" class="note"></div>
  <div class="chips">
    <button data-k="ready">🫶 準備好了</button>
    <button data-k="slow">🐢 慢一點</button>
    <button data-k="together">🤝 一起</button>
    <button data-k="steady">🌊 穩住</button>
  </div>
</section>

<!-- 結算 -->
<section id="result" class="screen">
  <div class="wrap">
    <p class="kicker" id="rKick">靠岸了</p>
    <h1 id="rTitle"></h1>
    <p class="lead" id="rText"></p>
    <div class="stats">
      <div><b id="sR">0</b><span>節奏</span></div>
      <div><b id="sH">0</b><span>同心</span></div>
      <div><b id="sC">0</b><span>平靜</span></div>
    </div>
    <p class="lead small" id="rTime"></p>
    <p class="quote" id="rQuote"></p>
    <button id="btnAgain" class="primary hidden">再航行一次</button>
    <p id="rWait" class="lead small hidden">等待船長決定下一趟…</p>
    <button id="btnHome" class="link">離開船隊</button>
  </div>
</section>

<script src="game.js"></script>
</body>
</html>
